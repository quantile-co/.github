name: Check

on:
  pull_request:
  push:
    branches-ignore: [main, "dependabot/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # GitHub renders called jobs as "caller / called", so main requires the
  # resulting "All / All" context even though each job is named "All".
  all:
    name: All
    if: github.ref != 'refs/heads/main'
    uses: quantile-co/factory/.github/workflows/check.yaml@0764e6f5f7e4d7f569f8151dcb702f87d62137a6
