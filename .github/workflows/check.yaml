name: Check

on:
  pull_request:
  push:
    branches-ignore: [main, "dependabot/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # GitHub renders called jobs as "caller / called", so main requires the
  # resulting "All / All" context even though each job is named "All".
  all:
    name: All
    if: github.ref != 'refs/heads/main'
    uses: quantile-co/factory/.github/workflows/check.yaml@aa1f81936ef7e12bb77cc2f1ddbbc96039fb177f
