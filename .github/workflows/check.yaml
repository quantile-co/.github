name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  all-checks:
    name: All
    # PRs only read public caches; no persistent runner store or cloud identity.
    runs-on: namespace-profile-quantile
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            require-sigs = true
            extra-substituters = https://quantile-co.cachix.org
            extra-trusted-public-keys = quantile-co.cachix.org-1:OM+kQzUqP3Ija8QQMUxvQNs97u6PB5/s83ZJe7c9WIQ=

      - name: Check repository
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run --show-output check:all
