name: Check

on:
  pull_request:

permissions:
  contents: read

jobs:
  all-checks:
    name: All
    # PRs only read public caches; no persistent runner store or cloud identity.
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Check repository
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run --show-output check:all
