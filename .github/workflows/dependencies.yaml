name: Dependencies

on:
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    name: ${{ matrix.label }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: git-hooks
            label: Git hooks
            task: git:update-hooks
          - target: nixpkgs
            label: Nixpkgs
            task: nix:update-nixpkgs
          - target: ci-devenv
            label: Devenv CLI
            task: devenv:update-ci
    # Isolate writable /nix state by updater, away from PRs and deployment.
    runs-on:
      - nscloud-ubuntu-24.04-amd64-4x8-with-cache
      - nscloud-cache-tag-quantile-co-dot-github-dependencies-${{ matrix.target }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Require the dedicated pull request token
        env:
          GITHUB_DEPENDENCY_PR_TOKEN: ${{ secrets.GITHUB_DEPENDENCY_PR_TOKEN || secrets.DEPENDENCY_PR_TOKEN }}
        run: test -n "$GITHUB_DEPENDENCY_PR_TOKEN"

      - name: Check out trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Refresh the pinned input
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run ${{ matrix.task }}

      - name: Validate the updated environment
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- --no-tui tasks run --show-output check:all

      - name: Disable the pre-push hook after the full gate
        run: git config --local core.hooksPath /dev/null

      - name: File a review-only pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_DEPENDENCY_PR_TOKEN || secrets.DEPENDENCY_PR_TOKEN }}
          add-paths: |
            devenv.yaml
            devenv.lock
            .github/workflows
          branch: chore/devenv-${{ matrix.target }}
          commit-message: 'chore(deps): review ${{ matrix.target }} update'
          title: 'chore(deps): review ${{ matrix.target }} update'
          body: |
            Review-only pinned ${{ matrix.target }} update.
            `check:all` passed before filing. No toolchain update auto-merges.
          delete-branch: true
