name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tofu:
    name: OpenTofu
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up OpenTofu
        uses: opentofu/setup-opentofu@9d84900f3238fab8cd84ce47d658d25dd008be2f # v1
        with:
          tofu_version: 1.12.3

      - name: Initialize without backend
        run: tofu -chdir=.github/tf init -backend=false -input=false

      - name: Check formatting
        run: tofu -chdir=.github/tf fmt -check

      - name: Validate
        run: tofu -chdir=.github/tf validate
