name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish-caches:
    name: Nix caches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Keep privileged jobs on fresh stores until the cache pilot passes.
    runs-on: namespace-profile-quantile
    timeout-minutes: 20
    steps:
      - name: Require the public cache upload token
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo '::error::Set the quantile-co Cachix write token as CACHIX_AUTH_TOKEN.'
            exit 1
          fi

      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            require-sigs = true
            extra-substituters = https://quantile-co.cachix.org
            extra-trusted-public-keys = quantile-co.cachix.org-1:OM+kQzUqP3Ija8QQMUxvQNs97u6PB5/s83ZJe7c9WIQ=

      - name: Build and smoke-test the environment for caching
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- test

      - name: Select environment closures
        id: cache-roots
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run cache:roots

      - name: Publish to Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: quantile-co
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipAddingSubstituter: true
          useDaemon: false
          pathsToPush: ${{ steps.cache-roots.outputs.paths }}
          cachixBin: ${{ steps.cache-roots.outputs.cachix-bin }}
