name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish-caches:
    name: Nix caches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: namespace-profile-quantile
    environment: build
    timeout-minutes: 20
    steps:
      - name: Require the public cache upload token
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo '::error::Set CACHIX_AUTH_TOKEN in the main-only build environment.'
            exit 1
          fi

      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_options: --no-daemon
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            require-sigs = true

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: quantile-co
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          useDaemon: false

      - name: Build and smoke-test the environment for caching
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- test

      # Remove this one-off step and script after cross-run qualification.
      - name: Qualify native cache persistence and substitution
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- shell -- bash .github/qualify-native-cache.sh
