name: Build

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  publish-caches:
    name: Publish Nix caches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      probe-path: ${{ steps.cache-probe.outputs.path }}
      probe-nar-hash: ${{ steps.cache-probe.outputs.nar-hash }}
    permissions:
      contents: read
      id-token: write
    # No restored runner store: publish only this trusted run's outputs.
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 20
    steps:
      - name: Require the public cache upload token
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
        run: |
          if [[ -z "$CACHIX_AUTH_TOKEN" ]]; then
            echo '::error::Set the quantile-co Cachix write token as CACHIX_AUTH_TOKEN.'
            exit 1
          fi

      - name: Check out trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Publish to Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: quantile-co
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          skipAddingSubstituter: true
          useDaemon: false

      - name: Publish to FlakeHub
        uses: DeterminateSystems/flakehub-cache-action@83282a8aef353db1d659d3bacf4a28b6683de0b3 # v3.22.5
        with:
          use-gha-cache: disabled

      - name: Build and smoke-test the environment for caching
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- test

      - name: Select a store path for readback
        id: cache-probe
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run cache:select-probe

  verify-caches:
    name: Verify Nix caches
    needs: publish-caches
    permissions:
      contents: read
      id-token: write
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 20
    steps:
      - name: Check out trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      # Determinate authenticates direct FlakeHub reads using GitHub OIDC.
      # Do not run either cache's publishing action here.
      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Fetch from each cache into a fresh store
        env:
          CACHE_TEST_PATH: ${{ needs.publish-caches.outputs.probe-path }}
          CACHE_TEST_NAR_HASH: ${{ needs.publish-caches.outputs.probe-nar-hash }}
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run --show-output cache:verify-reads
