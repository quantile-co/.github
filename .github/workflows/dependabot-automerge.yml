name: Auto-merge safe dependency updates

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    steps:
      # Never check out or execute the PR's code in this privileged workflow.
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for stable minor and patch updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
        run: |
          set -euo pipefail
          case "$UPDATE_TYPE" in
            version-update:semver-minor|version-update:semver-patch) ;;
            *) exit 0 ;;
          esac
          # Pre-1.0 and pre-releases still need a human review.
          [[ "$PREVIOUS_VERSION" =~ ^v?0([.]|$) ]] && exit 0
          [[ "$PREVIOUS_VERSION" == *-* || "$NEW_VERSION" == *-* ]] && exit 0
          [[ -n "$PREVIOUS_VERSION" && -n "$NEW_VERSION" ]] || exit 0
          gh pr merge --auto --squash "$PR_URL"
