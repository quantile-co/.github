name: Update

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependabot-automerge:
    name: GitHub Actions and OpenTofu providers
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: namespace-profile-quantile
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Never check out or execute PR code in this privileged job.
      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_options: --no-daemon
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            require-sigs = true

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: quantile-co
          skipPush: true
          useDaemon: false

      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for stable minor and patch updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run dependabot:automerge

  update:
    name: Nix inputs and Devenv CLI (${{ matrix.label }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: git-hooks
            label: Git hooks
            task: git:update-hooks
          - target: nixpkgs
            label: Nixpkgs
            task: nix:update-nixpkgs
          - target: ci-devenv
            label: Devenv CLI
            task: devenv:update-ci
    # Updated toolchains may reuse snapshots, but must not publish their changes.
    runs-on:
      - namespace-profile-quantile
      - nscloud-cache-exp-do-not-commit
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Require the dedicated pull request token
        env:
          GH_UPDATE_WORKFLOW_TOKEN: ${{ secrets.GH_UPDATE_WORKFLOW_TOKEN }}
        run: test -n "$GH_UPDATE_WORKFLOW_TOKEN"

      - name: Check out trusted main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_options: --no-daemon
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            require-sigs = true

      - name: Configure Cachix
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: quantile-co
          skipPush: true
          useDaemon: false

      - name: Update ${{ matrix.label }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run ${{ matrix.task }}

      - name: Validate the updated environment
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- --no-tui tasks run --show-output check:all

      - name: Disable the pre-push hook after the full gate
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- shell -- git config --local core.hooksPath /dev/null

      - name: File a review-only pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_UPDATE_WORKFLOW_TOKEN }}
          add-paths: |
            devenv.yaml
            devenv.lock
            .github/workflows
          branch: chore/devenv-${{ matrix.target }}
          commit-message: 'chore(deps): review ${{ matrix.target }} update'
          title: 'chore(deps): review ${{ matrix.target }} update'
          body: |
            Review-only pinned ${{ matrix.target }} update.
            `check:all` passed before filing. No toolchain update auto-merges.
          delete-branch: true
