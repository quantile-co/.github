name: Update

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  schedule:
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependabot-automerge:
    name: Dependabot auto-merge
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.base.ref == 'main'
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Never check out or execute PR code in this privileged job.
      - name: Check out trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0

      - name: Enable auto-merge for stable minor and patch updates
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.metadata.outputs.update-type }}
          PREVIOUS_VERSION: ${{ steps.metadata.outputs.previous-version }}
          NEW_VERSION: ${{ steps.metadata.outputs.new-version }}
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run dependabot:automerge

  update:
    name: 'Open PRs for: Git hooks, Nixpkgs, Devenv CLI'
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: git-hooks
            label: Git hooks
            task: git:update-hooks
          - target: nixpkgs
            label: Nixpkgs
            task: nix:update-nixpkgs
          - target: ci-devenv
            label: Devenv CLI
            task: devenv:update-ci
    # Updated toolchains must not populate caches consumed by trusted jobs.
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Require the dedicated pull request token
        env:
          GH_DEPENDENCY_PR_TOKEN: ${{ secrets.GH_DEPENDENCY_PR_TOKEN || secrets.DEPENDENCY_PR_TOKEN }}
        run: test -n "$GH_DEPENDENCY_PR_TOKEN"

      - name: Check out trusted main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Update ${{ matrix.label }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run ${{ matrix.task }}

      - name: Validate the updated environment
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- --no-tui tasks run --show-output check:all

      - name: Disable the pre-push hook after the full gate
        run: git config --local core.hooksPath /dev/null

      - name: File a review-only pull request
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GH_DEPENDENCY_PR_TOKEN || secrets.DEPENDENCY_PR_TOKEN }}
          add-paths: |
            devenv.yaml
            devenv.lock
            .github/workflows
          branch: chore/devenv-${{ matrix.target }}
          commit-message: 'chore(deps): review ${{ matrix.target }} update'
          title: 'chore(deps): review ${{ matrix.target }} update'
          body: |
            Review-only pinned ${{ matrix.target }} update.
            `check:all` passed before filing. No toolchain update auto-merges.
          delete-branch: true
