name: Apply

on:
  workflow_dispatch:
    inputs:
      plan_artifact_id:
        description: Plan artifact ID (valid for 24 hours)
        required: true
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  production:
    name: Infrastructure
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.actor) &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.triggering_actor)
    uses: quantile-co/factory/.github/workflows/apply.yaml@aa1f81936ef7e12bb77cc2f1ddbbc96039fb177f
    with:
      plan_artifact_id: ${{ inputs.plan_artifact_id }}
      tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      gcp_folder_id: ${{ vars.GCP_QUANTILE_CO_FOLDER_ID }}
      gcp_maintainers: ${{ vars.GCP_MAINTAINERS || '[]' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # GitHub requires the caller to pass even a protected environment secret by name.
      GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}
