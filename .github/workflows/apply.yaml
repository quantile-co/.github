name: Apply

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: repository-settings-production
  cancel-in-progress: false

jobs:
  apply:
    name: Repository settings
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.actor)
    # No persistent store or cache uploader in a credentialed job.
    runs-on: nscloud-ubuntu-24.04-amd64-4x8
    environment: prod
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      SECRETSPEC_PROFILE: prod
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_gcp_billing_account: ${{ vars.GCP_BILLING_ACCOUNT }}
      TF_VAR_gcp_quantile_co_folder_id: ${{ vars.GCP_QUANTILE_CO_FOLDER_ID }}
      TF_VAR_gcp_wif_pool: ${{ vars.GCP_WIF_POOL }}
      TF_VAR_github_maintainers: ${{ vars.GH_MAINTAINERS }}
      TF_VAR_github_quantile_co_token: ${{ secrets.TERRAFORM_GITHUB_QUANTILE_CO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: Set up Nix
        uses: ./.github/actions/setup-nix

      - name: Initialize state
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run tf:init

      - name: Validate
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run tf:validate

      - name: Plan
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run --show-output tf:plan

      - name: Apply exact plan
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run tf:apply
