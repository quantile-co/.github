name: Plan

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: organization-production
  cancel-in-progress: false

jobs:
  frozen:
    name: Resource operations paused for backend cutover
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: namespace-profile-quantile-4x8
    environment: prod
    timeout-minutes: 5
    steps:
      - name: Refuse resource Plan during backend migration
        run: exit 1
