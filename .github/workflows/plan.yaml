name: Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: repository-settings-production
  cancel-in-progress: false

jobs:
  plan:
    name: Infrastructure
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.actor)
    runs-on: namespace-profile-quantile
    environment: prod
    timeout-minutes: 15
    env:
      TF_IN_AUTOMATION: "true"
      SECRETSPEC_PROFILE: prod
      TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
      TF_VAR_gcp_billing_account: ${{ vars.GCP_BILLING_ACCOUNT }}
      TF_VAR_gcp_quantile_co_folder_id: ${{ vars.GCP_QUANTILE_CO_FOLDER_ID }}
      TF_VAR_gcp_wif_pool: ${{ vars.GCP_WIF_POOL }}
      TF_VAR_github_maintainers: ${{ vars.GH_MAINTAINERS }}
      TF_VAR_github_quantile_co_token: ${{ secrets.TERRAFORM_GITHUB_QUANTILE_CO_TOKEN }}

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_options: --no-daemon
          github_access_token: ${{ github.token }}
          extra_nix_config: |
            require-sigs = true
            extra-substituters = https://quantile-co.cachix.org
            extra-trusted-public-keys = quantile-co.cachix.org-1:OM+kQzUqP3Ija8QQMUxvQNs97u6PB5/s83ZJe7c9WIQ=

      - name: Initialize state
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run tf:init

      - name: Validate
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run tf:validate

      - name: Plan
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run --show-output tf:plan

      - name: Flush the Nix store and database
        run: >-
          nix run --accept-flake-config
          github:cachix/devenv/b904dcb51fe48c30db250038241507f60752f222
          -- tasks run cache:sync
