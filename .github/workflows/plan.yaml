name: Plan

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  id-token: write

jobs:
  # Temporary first-plan preflight: the existing WIF provider accepts only
  # plan.yaml and apply.yaml on protected main, not standalone diagnostics.
  preflight:
    name: Inspect backend lock (temporary)
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.actor) &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.triggering_actor)
    runs-on: namespace-profile-quantile-4x8
    environment: prod
    concurrency:
      group: factory-production
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_options: --no-daemon
          extra_nix_config: |
            require-sigs = true
            extra-substituters = https://devenv.cachix.org https://quantile-co.cachix.org https://cache.numtide.com https://cachix.cachix.org https://pre-commit-hooks.cachix.org https://go-overlay.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= quantile-co.cachix.org-1:OM+kQzUqP3Ija8QQMUxvQNs97u6PB5/s83ZJe7c9WIQ= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM= pre-commit-hooks.cachix.org-1:Pkk3Panw5AW24TOv6kz3PvLhlH8puAsJTBbOPmBo7Rc= go-overlay.cachix.org-1:rJ155O3K6WUyUcoKE4MqcC6JcLlK2vPXnP5/76BxWD8=

      - name: Inspect lock without reading its contents
        env:
          SECRETSPEC_PROFILE: check
          GCP_TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_BACKEND_PREFIX: repository/prod
        run: |
          cli="$(nix build --no-link --print-out-paths .#devenv-cli)/bin/devenv"
          "$cli" shell -- bash .github/scripts/temporary-inspect-lock.sh

      - name: Publish only encrypted lock diagnostics when locked
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-lock-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-backend-lock/diagnostic.json.age
          if-no-files-found: ignore
          retention-days: 1

      - name: Remove local lock ciphertext
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/encrypted-backend-lock"

  production:
    name: Infrastructure
    needs: preflight
    if: >-
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.actor) &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.triggering_actor)
    uses: quantile-co/factory/.github/workflows/plan.yaml@aa1f81936ef7e12bb77cc2f1ddbbc96039fb177f
    with:
      tf_state_bucket: ${{ vars.TF_STATE_BUCKET }}
      gcp_folder_id: ${{ vars.GCP_QUANTILE_CO_FOLDER_ID }}
      gcp_maintainers: ${{ vars.GCP_MAINTAINERS || '[]' }}
    secrets:
      CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
      # GitHub requires the caller to pass even a protected environment secret by name.
      GH_REPO_TOKEN: ${{ secrets.GH_REPO_TOKEN }}

  # The saved plan must be reviewed privately before its proposed reader IAM
  # binding can be applied. Upload only ciphertext, never provider payloads.
  handoff:
    name: Encrypt the verified private saved plan (temporary)
    needs: production
    if: >-
      success() &&
      github.ref == 'refs/heads/main' &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.actor) &&
      contains(fromJSON(vars.GH_MAINTAINERS), github.triggering_actor)
    runs-on: namespace-profile-quantile-4x8
    environment: prod
    concurrency:
      group: factory-production
      cancel-in-progress: false
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}

      - name: Mount the Nix store and database
        uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
        with:
          path: /nix
          spacectl-version: 0.12.3
          spacectl-system-binary: ignore

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          install_options: --no-daemon
          extra_nix_config: |
            require-sigs = true
            extra-substituters = https://devenv.cachix.org https://quantile-co.cachix.org https://cache.numtide.com https://cachix.cachix.org https://pre-commit-hooks.cachix.org https://go-overlay.cachix.org
            extra-trusted-public-keys = devenv.cachix.org-1:w1cLUi8dv3hnoSPGAuibQv+f9TZLr6cv/Hm9XgU50cw= quantile-co.cachix.org-1:OM+kQzUqP3Ija8QQMUxvQNs97u6PB5/s83ZJe7c9WIQ= niks3.numtide.com-1:DTx8wZduET09hRmMtKdQDxNNthLQETkc/yaX7M4qK0g= cachix.cachix.org-1:eWNHQldwUO7G2VkjpnjDbWwy4KQ/HNxht7H4SSoMckM= pre-commit-hooks.cachix.org-1:Pkk3Panw5AW24TOv6kz3PvLhlH8puAsJTBbOPmBo7Rc= go-overlay.cachix.org-1:rJ155O3K6WUyUcoKE4MqcC6JcLlK2vPXnP5/76BxWD8=

      - name: Encrypt the exact successful Plan artifact
        env:
          SECRETSPEC_PROFILE: check
          GH_TOKEN: ${{ github.token }}
          GCP_TF_STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          TF_BACKEND_PREFIX: repository/prod
          PLAN_RUN_ID: ${{ github.run_id }}
          PLAN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          cli="$(nix build --no-link --print-out-paths .#devenv-cli)/bin/devenv"
          "$cli" shell -- bash .github/scripts/temporary-private-plan-handoff.sh

      - name: Publish only encrypted ciphertext
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: private-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted-plan/plan.tfplan.age
          if-no-files-found: error
          retention-days: 1

      - name: Remove local ciphertext and temporary files
        if: always()
        run: rm -rf -- "$RUNNER_TEMP/encrypted-plan"
