name: Set up Nix
# Cache store contents and validity metadata, not the installation receipt:
# a fresh runner must install and start its own Determinate Nix daemon.
description: Set up a persistent Namespace Nix store and Determinate Nix
inputs:
  flakehub-cache:
    description: Enable FlakeHub Cache (requires id-token write permission)
    default: 'false'
    required: false
  cachix-auth-token:
    description: Optional upload token for the quantile-co public cache (trusted main only)
    default: ''
    required: false
runs:
  using: composite
  steps:
    - name: Mount Namespace Nix cache volume
      uses: namespacelabs/nscloud-cache-action@1124a6f3ce44e5cf84cc22111530961f4d2a15f9 # v1
      with:
        path: |
          /nix/store
          /nix/var/nix/db
          /home/runner/.cache/nix

    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5

    - name: Configure public Cachix cache
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: quantile-co
        authToken: ${{ inputs.cachix-auth-token }}
        skipPush: ${{ inputs.cachix-auth-token == '' }}
        # Store scan at job end avoids competing upload hooks with FlakeHub.
        useDaemon: false

    - name: Enable FlakeHub Cache
      if: inputs.flakehub-cache == 'true'
      uses: DeterminateSystems/flakehub-cache-action@83282a8aef353db1d659d3bacf4a28b6683de0b3 # v3.22.5
      with:
        use-gha-cache: disabled
