name: Set up Nix
description: Install fresh Determinate Nix with signature-checked public cache reads
runs:
  using: composite
  steps:
    - name: Require a fresh Nix installation
      shell: bash
      run: test ! -e /nix/receipt.json

    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
      with:
        extra-conf: |
          require-sigs = true
          extra-substituters = https://quantile-co.cachix.org
          extra-trusted-public-keys = quantile-co.cachix.org-1:OM+kQzUqP3Ija8QQMUxvQNs97u6PB5/s83ZJe7c9WIQ=
