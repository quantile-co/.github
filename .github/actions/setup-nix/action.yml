name: Set up Nix
description: Install fresh Determinate Nix with signature-checked public cache reads
runs:
  using: composite
  steps:
    - name: Require a fresh Nix installation
      shell: bash
      run: test ! -e /nix/receipt.json

    - name: Install Determinate Nix
      uses: DeterminateSystems/determinate-nix-action@8d87e8d5e5b8a8309d4281094560f127d9a265f1 # v3.22.5
      with:
        extra-conf: |
          require-sigs = true

    - name: Configure public Cachix reads
      uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
      with:
        name: quantile-co
        skipPush: 'true'
        useDaemon: false
