[project]
name = "quantile-co-github"
revision = "1.0"

[profiles.default]
# SecretSpec rejects empty profiles. Leave this optional placeholder unset so
# ordinary shell entry and checks need no credentials.
SECRETSPEC_DEFAULT_PLACEHOLDER = { description = "Unused compatibility placeholder.", required = false }

# Select prod explicitly for credentialed deployment tasks.
[profiles.prod]
TF_STATE_BUCKET = { description = "GCS bucket holding this repository's OpenTofu state.", required = true }
TF_VAR_gcp_billing_account = { description = "Billing account for this repository's GCP project.", required = true }
TF_VAR_gcp_quantile_co_folder_id = { description = "Parent quantile-co folder ID.", required = true }
TF_VAR_gcp_wif_pool = { description = "Shared GitHub workload identity pool path.", required = true }
TF_VAR_github_maintainers = { description = "JSON array of trusted maintainers.", required = true }
TF_VAR_github_quantile_co_token = { description = "Repository-scoped GitHub management token.", required = true }
