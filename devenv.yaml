# Runtime shell loading handles validation; avoid evaluation-time secret resolution.
secretspec:
  enable: false

inputs:
  factory:
    url: github:quantile-co/factory/c0fd54801c96766033ba8fd59cb8fb126044660c
    flake: true
  nixpkgs:
    follows: factory/nixpkgs
  devenv:
    follows: factory/devenv
  git-hooks:
    follows: factory/git-hooks
  go-overlay:
    follows: factory/go-overlay
  llm-agents:
    follows: factory/llm-agents
  mk-shell-bin:
    follows: factory/mk-shell-bin
  nix2container:
    follows: factory/nix2container
