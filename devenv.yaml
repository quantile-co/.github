# Runtime shell loading handles validation; avoid evaluation-time secret resolution.
secretspec:
  enable: false

inputs:
  dot-github:
    url: git+file:.
    flake: true
  factory:
    follows: dot-github/factory
  nixpkgs:
    follows: dot-github/nixpkgs
  devenv:
    follows: dot-github/devenv
  git-hooks:
    follows: dot-github/git-hooks
  go-overlay:
    follows: dot-github/go-overlay
  llm-agents:
    follows: dot-github/llm-agents
  mk-shell-bin:
    follows: dot-github/mk-shell-bin
  nix2container:
    follows: dot-github/nix2container
