# Runtime shell loading handles validation; avoid evaluation-time secret resolution.
secretspec:
  enable: false

inputs:
  this:
    url: git+file:.
    flake: true
  factory:
    follows: this/factory
  nixpkgs:
    follows: this/nixpkgs
  devenv:
    follows: this/devenv
  git-hooks:
    follows: this/git-hooks
  go-overlay:
    follows: this/go-overlay
  llm-agents:
    follows: this/llm-agents
  mk-shell-bin:
    follows: this/mk-shell-bin
  nix2container:
    follows: this/nix2container
