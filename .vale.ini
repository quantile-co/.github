StylesPath = .vale/styles
MinAlertLevel = suggestion

# Pin the upstream package for reproducible syncs; its rules are vendored so
# credential-free CI and editor integrations do not need a network download.
Packages = https://github.com/vale-cli/Google/releases/download/v0.7.1/Google.zip

[*.md]
BasedOnStyles = Google, Quantile
# Promote enabled upstream advisory rules: all Vale findings fail the gate.
Google.Acronyms = error
Google.Anthropomorphism = error
Google.Colons = error
Google.Contractions = error
Google.Ellipses = error
Google.ExcessiveClaims = error
Google.FirstPerson = error
Google.HeadingPunctuation = error
Google.Headings = error
Google.Jargon = error
Google.OxfordComma = error
Google.Parens = error
Google.Passive = error
Google.Ranges = error
Google.Semicolons = error
Google.Spelling = error
Google.Timeless = error
Google.We = error
Google.Will = error
# Upstream matches "Cloud" inside the product names Google Cloud and Cloud
# Storage, so its suggested replacements would corrupt valid names.
Google.WordList = NO
Google.WordListCase = error

# An intentionally failing plain-text fixture tests both styles without
# becoming an ordinary Markdown document in the repository check.
[.vale/test/*.txt]
BasedOnStyles = Google, Quantile
